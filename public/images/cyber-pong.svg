<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0e1738"/>
      <stop offset="100%" stop-color="#1e0b36"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="2">
    <line x1="400" y1="20" x2="400" y2="430" stroke-dasharray="14 14" stroke="#475569"/>
    <rect x="40" y="30" width="720" height="390" rx="24" fill="none" stroke="#334155" stroke-width="3"/>
  </g>
  <!-- Left Paddle -->
  <rect x="82" y="135" width="22" height="130" rx="11" fill="#06b6d4"/>
  <rect x="76" y="129" width="34" height="142" rx="16" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.5"/>
  <!-- Right Paddle -->
  <rect x="696" y="175" width="22" height="130" rx="11" fill="#f43f5e"/>
  <rect x="690" y="169" width="34" height="142" rx="16" fill="none" stroke="#fb7185" stroke-width="3" opacity="0.5"/>
  <!-- Motion trail -->
  <path d="M 110 200 L 310 70 L 470 235" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.45"/>
  <circle cx="470" cy="235" r="48" fill="url(#orb)"/>
  <circle cx="470" cy="235" r="16" fill="#fff"/>
</svg>