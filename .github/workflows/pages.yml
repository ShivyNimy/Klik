name: Build and deploy Klik to GitHub Pages

on:
  push:
    branches:
      - main
      # Run the build/tests for every working branch, not just one stale name.
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test all games
        run: npm test

      - name: Soak-test 99 Nights
        run: npm run test:n99

      - name: Test browser boot
        run: npm run test:boot

      - name: Test standalone build
        run: npm run test:standalone

      - name: Build and verify GitHub Pages output
        run: npm run test:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      # `deploy-pages` only works when the Pages site uses "GitHub Actions" as its
      # build source. Repos still on the legacy branch/Jekyll source would fail
      # here, so detect that case and warn instead of leaving a red build.
      - name: Check GitHub Pages build source
        id: pages_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || echo unknown)"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          if [ "$build_type" != "workflow" ]; then
            echo "::warning::GitHub Pages source is '$build_type'. In repo Settings → Pages → Build and deployment, set Source to 'GitHub Actions' to publish the built artifact."
          fi
      - name: Deploy to GitHub Pages
        if: steps.pages_source.outputs.build_type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v5
